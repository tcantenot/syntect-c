[package]
name    = "syntect-c"
version = "0.1.0"
edition = "2021"

[lib]
name       = "syntect_c"
crate-type = ["staticlib"]

[dependencies]
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-onig",
] }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = "symbols"
