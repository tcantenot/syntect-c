name: Build syntect-c prebuilts

on:
  workflow_dispatch:
  push:
    paths:
      - 'rust/src/**'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'scripts/**'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: bash scripts/build-syntect.sh
      # Stripped libraries
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilts-linux
          path: lib/linux-*/libsyntect_c.a
      # Debug symbols
      - uses: actions/upload-artifact@v4
        with:
          name: debug-linux
          path: lib/linux-*/*.debug
          if-no-files-found: warn

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: bash scripts/build-syntect.sh
      # Stripped libraries
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilts-macos
          path: lib/macos-*/libsyntect_c.a
      # Debug symbols
      - uses: actions/upload-artifact@v4
        with:
          name: debug-macos
          path: lib/macos-*/*.debug
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - shell: pwsh
        run: .\scripts\build-syntect.ps1
      # Stripped library
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilts-windows
          path: lib/windows-*/syntect_c.lib
      # PDB debug symbols
      - uses: actions/upload-artifact@v4
        with:
          name: debug-windows
          path: lib/windows-*/*.pdb
          if-no-files-found: warn

  commit:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Download stripped libraries
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilts-*
          merge-multiple: true
          path: lib/
      # Download debug artifacts into the same lib/ tree alongside the stripped libs
      - uses: actions/download-artifact@v4
        with:
          pattern: debug-*
          merge-multiple: true
          path: lib/
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/
          git diff --cached --quiet || git commit -m "ci: update pre-built syntect-c libraries"
          git push
