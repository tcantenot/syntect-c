[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
# Disable rustc's self-contained linker, which injects the host x86_64 rust-lld
# into the link command — incompatible with aarch64 objects when cross-compiling cdylib.
rustflags = ["-C", "link-self-contained=no"]

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
