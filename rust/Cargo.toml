[package]
name    = "syntect-c"
version = "0.1.0"
edition = "2024"

[lib]
name       = "syntect_c"
crate-type = ["staticlib"]

[dependencies]
syntect = { version = "5.3.0", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-onig",
] }

[profile.release]
opt-level       = "z"      # minimize binary size
lto             = true
codegen-units   = 1
debug           = true      # generate DWARF/PDB; build scripts extract it before stripping
strip           = "none"    # stripping is done in build scripts so .debug files can be saved first
split-debuginfo = "packed"  # Windows: /Zi → separate .pdb; macOS: dsymutil; Linux: no-op
panic           = "abort"   # safe for C FFI (panics must never cross the boundary); removes unwind machinery
